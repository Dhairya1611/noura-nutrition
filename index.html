<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17362c" />
    <meta name="description" content="Account-synced food scanning, calorie tracking, and nutrition coaching." />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <title>Noura — eat with intention</title>
  </head>
  <body>
    <div id="app">
      <main style="min-height:100vh;display:grid;place-items:center;background:#f8f6ee;color:#17362c;font-family:system-ui,-apple-system,sans-serif">
        <div style="display:grid;justify-items:center;gap:12px;text-align:center;padding:24px">
          <span style="display:grid;place-items:center;width:52px;height:52px;border-radius:15px;background:#c9f36a;font-size:24px">◒</span>
          <strong style="font-size:20px">Opening Noura…</strong>
          <span style="color:#66756f;font-size:14px">Loading your saved nutrition plan.</span>
          <button type="button" onclick="location.reload()" style="margin-top:6px;border:1px solid #cad0c8;border-radius:999px;background:white;color:#17362c;padding:9px 16px;font:inherit;cursor:pointer">Reload</button>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
